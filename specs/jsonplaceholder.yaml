# Second genericity proof: JSONPlaceholder, a free fake REST API, no auth.
# https://jsonplaceholder.typicode.com  (read-only operations only; no POST/PUT/DELETE on purpose)
# Observed on the real API: unknown ids on /posts/{id} and /users/{id} return 404 with body {};
# /posts/{id}/comments for an unknown post and /posts?userId=<unknown> return 200 with [].
system_name: jsonplaceholder
description: Fake blog REST API (posts, comments, users) from JSONPlaceholder, free, no API key.
base_url: https://jsonplaceholder.typicode.com
base_url_env: JSONPLACEHOLDER_BASE_URL
timeout_s: 10
# ENFORCED, not a promise: the generator refuses any write operation in this spec and the HTTP runtime
# refuses to send a non-GET request. A person must review safety fields before a write op may exist here.
read_only: true
auth: {kind: none}
error_map:
  - {when: {status: 429}, code: RATE_LIMITED, retryable: true, recovery: agent, meaning: "Rate limit reached; retry later"}
  - {when: {status: 5xx}, code: SERVICE_UNAVAILABLE, retryable: true, recovery: agent, meaning: "JSONPlaceholder is unavailable"}

operations:
  - name: get_post
    summary: Get one blog post by its id.
    when_to_call: Call when you know a post id and need its title and body; use list_posts_by_user to find ids.
    side_effect: read
    idempotent: true
    request:
      method: GET
      path: /posts/{post_id}
    params:
      - {name: post_id, type: integer, in: path, required: true,
         description: "Id of the post, 1 to 100 exist.", constraints: {minimum: 1}}
    response:
      type: object
      description: "id (post id), userId (author's user id), title (string), body (string, may contain newlines)."
    errors:
      - {when: {status: 404}, code: POST_NOT_FOUND, retryable: false, recovery: agent, meaning: "No post with that id; look up a valid id with list_posts_by_user"}
    examples:
      - name: post_one
        args: {post_id: 1}
        mock:
          status: 200
          body: {userId: 1, id: 1, title: "sunt aut facere repellat provident occaecati excepturi optio reprehenderit", body: "quia et suscipit\nsuscipit recusandae consequuntur expedita et cum\nreprehenderit molestiae ut ut quas totam\nnostrum rerum est autem sunt rem eveniet architecto"}
        expect: ok
        expect_keys: [id, userId, title, body]
      - name: post_id_zero
        args: {post_id: 0}
        expect: {code: INVALID_ARGUMENT, retryable: false, recovery: agent}
      - name: unknown_post
        args: {post_id: 99999}
        mock: {status: 404, body: {}}
        expect: {code: POST_NOT_FOUND, retryable: false, recovery: agent}

  - name: list_posts_by_user
    summary: List all blog posts written by one user.
    when_to_call: Call when you need the posts of a known user id, or to discover valid post ids; an unknown user yields an empty list, not an error.
    side_effect: read
    idempotent: true
    request:
      method: GET
      path: /posts
    params:
      - {name: user_id, wire_name: userId, type: integer, in: query, required: true,
         description: "Id of the author, 1 to 10 exist.", constraints: {minimum: 1}}
    response:
      type: array
      description: "List of posts, each with id, userId, title and body. Empty list if the user has no posts or does not exist."
    examples:
      - name: posts_of_user_one
        args: {user_id: 1}
        mock:
          status: 200
          body:
            - {userId: 1, id: 1, title: "sunt aut facere repellat provident occaecati excepturi optio reprehenderit", body: "quia et suscipit\nsuscipit recusandae consequuntur expedita et cum\nreprehenderit molestiae ut ut quas totam\nnostrum rerum est autem sunt rem eveniet architecto"}
            - {userId: 1, id: 2, title: "qui est esse", body: "est rerum tempore vitae\nsequi sint nihil reprehenderit dolor beatae ea dolores neque\nfugiat blanditiis voluptate porro vel nihil molestiae ut reiciendis\nqui aperiam non debitis possimus qui neque nisi nulla"}
        expect: ok
      - name: unknown_user_is_empty_list
        args: {user_id: 999}
        mock: {status: 200, body: []}
        expect: ok
      - name: user_id_zero
        args: {user_id: 0}
        expect: {code: INVALID_ARGUMENT, retryable: false, recovery: agent}
      - name: service_down
        args: {user_id: 1}
        mock: {status: 503, body: {}}
        expect: {code: SERVICE_UNAVAILABLE, retryable: true, recovery: agent}

  - name: get_user
    summary: Get one user's profile, including address and company.
    when_to_call: Call when you know a user id and need contact details, address or company; the userId on a post is such an id.
    side_effect: read
    idempotent: true
    request:
      method: GET
      path: /users/{user_id}
    params:
      - {name: user_id, type: integer, in: path, required: true,
         description: "Id of the user, 1 to 10 exist.", constraints: {minimum: 1}}
    response:
      type: object
      description: "id, name, username, email, phone, website, plus nested address (street, suite, city, zipcode, geo{lat, lng} as strings) and company (name, catchPhrase, bs)."
    errors:
      - {when: {status: 404}, code: USER_NOT_FOUND, retryable: false, recovery: agent, meaning: "No user with that id; valid ids are 1 to 10"}
    examples:
      - name: user_one
        args: {user_id: 1}
        mock:
          status: 200
          body:
            id: 1
            name: "Leanne Graham"
            username: "Bret"
            email: "Sincere@april.biz"
            address: {street: "Kulas Light", suite: "Apt. 556", city: "Gwenborough", zipcode: "92998-3874", geo: {lat: "-37.3159", lng: "81.1496"}}
            phone: "1-770-736-8031 x56442"
            website: "hildegard.org"
            company: {name: "Romaguera-Crona", catchPhrase: "Multi-layered client-server neural-net", bs: "harness real-time e-markets"}
        expect: ok
        expect_keys: [id, name, email, address, company]
      - name: user_id_zero
        args: {user_id: 0}
        expect: {code: INVALID_ARGUMENT, retryable: false, recovery: agent}
      - name: unknown_user
        args: {user_id: 999}
        mock: {status: 404, body: {}}
        expect: {code: USER_NOT_FOUND, retryable: false, recovery: agent}

  - name: list_comments_for_post
    summary: List all comments left on one blog post.
    when_to_call: Call when you need the discussion under a known post id; an unknown post id yields an empty list.
    side_effect: read
    idempotent: true
    request:
      method: GET
      path: /posts/{post_id}/comments
    params:
      - {name: post_id, type: integer, in: path, required: true,
         description: "Id of the post whose comments to list, 1 to 100 exist.", constraints: {minimum: 1}}
    response:
      type: array
      description: "List of comments, each with id, postId, name (subject), email (commenter) and body. Empty list if there are none."
    errors:
      # Defensive: the real API answers 200 [] for unknown posts, but a 404 here should still be specific.
      - {when: {status: 404}, code: POST_NOT_FOUND, retryable: false, recovery: agent, meaning: "No post with that id"}
    examples:
      - name: comments_on_post_one
        args: {post_id: 1}
        mock:
          status: 200
          body:
            - {postId: 1, id: 1, name: "id labore ex et quam laborum", email: "Eliseo@gardner.biz", body: "laudantium enim quasi est quidem magnam voluptate ipsam eos\ntempora quo necessitatibus\ndolor quam autem quasi\nreiciendis et nam sapiente accusantium"}
            - {postId: 1, id: 2, name: "quo vero reiciendis velit similique earum", email: "Jayne_Kuhic@sydney.com", body: "est natus enim nihil est dolore omnis voluptatem numquam\net omnis occaecati quod ullam at\nvoluptatem error expedita pariatur\nnihil sint nostrum voluptatem reiciendis et"}
        expect: ok
      - name: unknown_post_is_empty_list
        args: {post_id: 99999}
        mock: {status: 200, body: []}
        expect: ok
      - name: post_id_zero
        args: {post_id: 0}
        expect: {code: INVALID_ARGUMENT, retryable: false, recovery: agent}
      - name: post_not_found
        args: {post_id: 99999}
        mock: {status: 404, body: {}}
        expect: {code: POST_NOT_FOUND, retryable: false, recovery: agent}
