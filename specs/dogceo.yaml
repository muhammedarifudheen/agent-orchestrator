system_name: dogceo
description: Free read-only service returning dog breed lists and random dog photos
  as JSON, no key needed.
base_url: https://dog.ceo/api
base_url_env: DOGCEO_BASE_URL
timeout_s: 10
auth:
  kind: none
error_map:
- when:
    status: 429
  code: RATE_LIMITED
  retryable: true
  recovery: agent
  meaning: Rate limit reached; retry later
- when:
    status: 5xx
  code: SERVICE_UNAVAILABLE
  retryable: true
  recovery: agent
  meaning: The service is unavailable
operations:
- name: list_all_breeds
  summary: List every dog breed and its sub-breeds.
  when_to_call: Call when you need the valid breed names, for example before asking
    for a picture of one breed.
  side_effect: read
  idempotent: true
  request:
    method: GET
    path: /breeds/list/all
  params: []
  response:
    type: object
    description: Object with message (breed name to list of sub-breed names) and status.
  examples:
  - name: example
    args: {}
    mock:
      status: 200
      body:
        message:
          affenpinscher: []
          african:
          - wild
          australian:
          - kelpie
          - shepherd
        status: success
    expect: ok
    expect_keys:
    - message
    - status
  - name: service_unavailable
    args: {}
    mock:
      status: 503
      body:
        error: service unavailable
    expect:
      code: SERVICE_UNAVAILABLE
      retryable: true
      recovery: agent
  review:
    source: llm
    safety_fields: unreviewed
  confidence: 0.9
  needs_review: false
  review_reasons: []
- name: get_random_dog_image
  summary: Get the web address of one random dog photo from any breed.
  when_to_call: Call when you want a random dog picture and do not care about the
    breed.
  side_effect: read
  idempotent: true
  request:
    method: GET
    path: /breeds/image/random
  params: []
  response:
    type: object
    description: Object with message (photo URL) and status.
  examples:
  - name: example
    args: {}
    mock:
      status: 200
      body:
        message: https://images.dog.ceo/breeds/brabancon/n02112706_449.jpg
        status: success
    expect: ok
    expect_keys:
    - message
    - status
  - name: service_unavailable
    args: {}
    mock:
      status: 503
      body:
        error: service unavailable
    expect:
      code: SERVICE_UNAVAILABLE
      retryable: true
      recovery: agent
  review:
    source: llm
    safety_fields: unreviewed
  confidence: 0.9
  needs_review: false
  review_reasons: []
- name: get_random_image_by_breed
  summary: Get the web address of one random photo of a chosen breed.
  when_to_call: Call when you want a random picture of a specific main breed such
    as hound.
  side_effect: read
  idempotent: true
  request:
    method: GET
    path: /breed/{breed}/images/random
  params:
  - name: breed
    type: string
    in: path
    required: true
    description: Main breed name, for example hound.
  response:
    type: object
    description: Object with message (photo URL) and status.
  examples:
  - name: example
    args:
      breed: hound
    mock:
      status: 200
      body:
        message: https://images.dog.ceo/breeds/hound-basset/n02088238_9922.jpg
        status: success
    expect: ok
    expect_keys:
    - message
    - status
  - name: service_unavailable
    args:
      breed: hound
    mock:
      status: 503
      body:
        error: service unavailable
    expect:
      code: SERVICE_UNAVAILABLE
      retryable: true
      recovery: agent
  review:
    source: llm
    safety_fields: unreviewed
  confidence: 0.9
  needs_review: false
  review_reasons: []
