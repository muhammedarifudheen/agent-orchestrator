      from 1 sample(s)).
  response:
    type: object
    description: 'Object with top-level keys: fact (string), length (integer).'
  examples:
  - name: observed_response
    args: {}
    mock:
      status: 200
      body:
        fact: The cat who holds the record for the longest non-fatal fall is Andy.
          He fell from the 16th floor of an apartment building (about 200 ft/.06 km)
          and survived.
