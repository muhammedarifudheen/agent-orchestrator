[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = . servers
testpaths = tests
markers =
    budget(seconds): wall-clock budget for a gate test (default 2s). Tests that run the pipeline's subprocess gates declare more.
    slow: excluded from the default run (skipped with a reason); run with --runslow. Only for a test whose cost is real end-to-end work that other, cheaper tests already cover in part (CLAUDE.md D17).
