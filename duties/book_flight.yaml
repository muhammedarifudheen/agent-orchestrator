name: book_flight
description: Search flights for a route and date, book the first listed flight for the named passenger, then email the confirmation.
review: {status: reviewed, reviewer: "Duty Library Maintainers (initial set)"}
intent_patterns:
  - "book a flight from {origin} to {destination} on {date} for {passenger_name} at {passenger_email}"
parameters:
  origin: {type: string, pattern: "^[A-Za-z]{3}$", transform: upper}
  destination: {type: string, pattern: "^[A-Za-z]{3}$", transform: upper}
  date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  passenger_name: {type: string, pattern: "^[A-Za-z][A-Za-z .'-]{1,59}$"}
  passenger_email: {type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", transform: lower}
steps:
  - id: search
    tool: travel__search_flights
    args: {origin: "$intent.origin", destination: "$intent.destination", date: "$intent.date"}
  - id: book
    tool: travel__book_flight
    args: {flight_id: "$search.0.flight_id", passenger_name: "$intent.passenger_name", passenger_email: "$intent.passenger_email"}
  - id: confirm
    tool: travel__send_confirmation
    args: {email: "$intent.passenger_email", booking_ref: "$book.booking_ref", details: "Your flight booking is confirmed."}
write_boundary: {before: book}
success: {name: confirmation_email_sent, check: "$confirm", equals: true}
example: {intent: "book a flight from del to bom on $today+60 for Asha Verma at asha@example.com", expect: success}
