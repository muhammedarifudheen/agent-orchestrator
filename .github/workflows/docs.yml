name: docs

# Builds the documentation site from the repo's own Markdown, runs the drift test, and deploys to GitHub Pages ONLY if the drift test passes.
# A pull request builds and tests but never deploys. Enabling Pages is a one-time human action (docs/PUBLISHING.md): until it is done the
# configure-pages step below fails, which is the intended behaviour. Nothing here creates the repository setting or pushes anywhere.

# Every action is pinned to a full commit SHA, with its version in the comment on the same line: a tag such as @v4 can be moved to other
# code, a SHA cannot. The SHAs were resolved from the public repositories with `git ls-remote` on 2026-11-16 and have not been exercised by
# a run (AUDIT.md 3a C66). tests/test_site_publishing.py fails on any `uses:` that is not SHA-pinned with a version comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the Pages base path (fails until Pages is enabled by a human)
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's dependencies
        run: npm ci
        working-directory: site

      - name: Build the site from ../AUDIT.md, ../PROJECT_STATUS.md, ../docs/*.md and ../CLAUDE.md
        run: npm run build
        working-directory: site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the test dependencies
        run: pip install -r requirements.txt

      - name: Drift test (REQUIRED - a failure stops this job, so nothing is uploaded or deployed)
        run: python -m pytest tests/test_site_drift.py -q -p no:cacheprovider
        env:
          RUN_SITE: "1"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
