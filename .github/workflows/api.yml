name: api

# Tests the minimal API on every push to main and every pull request; deploys it to Railway ONLY from a push to main, and only after the tests pass.
# The deploy needs a Railway project token in the repository secret RAILWAY_TOKEN (api/README.md, "Deploying"); without it the deploy job fails on its
# first step with that message, on purpose. No model key is used here or on the host: the service refuses to start if one is set.
# Every action is pinned to a full commit SHA with its version in the comment on the same line (the same rule, and the same SHAs, as docs.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install the service's requirements and the test tools
        run: pip install -r api/requirements.txt pytest pytest-asyncio httpx

      - name: API tests (REQUIRED - the deploy job needs this one)
        run: python -m pytest tests/test_api_flows.py tests/test_api_deploy_files.py -q -p no:cacheprovider

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Check that the deploy credentials exist
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Create a Railway project token and add it as a repository secret (api/README.md, Deploying)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.75.0

      - name: Deploy (builds the Dockerfile on Railway; waits for the build)
        run: |
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --ci --service "$RAILWAY_SERVICE"
          else
            railway up --ci
          fi

      - name: Smoke test the public URL (runs when the repository variable API_URL is set)
        if: env.API_URL != ''
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/healthz" -o health.json; then break; fi
            echo "not up yet (attempt $attempt)"; sleep 10
          done
          cat health.json
          python3 - <<'PY'
          import json, re
          body = open("health.json", encoding="utf-8").read()
          data = json.loads(body)
          assert data == {"status": "ok", "flows": ["duty-match", "write-check", "propose"], "planner": False, "doc_extraction": False}, data
          assert not re.search(r"\bC\d+\b", body), "the public response must not name an audit row"
          print("healthz ok: the three flows, no planner, no document extraction")
          PY
